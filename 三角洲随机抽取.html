<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三角洲行动 · 装备随机抽取</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    [v-cloak]{display:none}
    :root{
      color-scheme:dark;
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      --accent:#38bdf8;
      --bg:#0f172a;
      --panel:rgba(15,23,42,.88);
      --border:rgba(56,189,248,.22);
      --danger:rgba(248,113,113,.25);
      --ok:#22c55e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      padding:0;
      color:#f8fafc;
      background-color:#0f172a;
      background-image:
        linear-gradient(rgba(4,6,18,.35),rgba(4,6,18,.55)),
        url("https://playerhub.df.qq.com/playerhub/be1db7e5-58e4-4a32-9590-de6e918688e6.png");
      background-position:center;
      background-size:cover;
      background-attachment:fixed;
    }
    body:not(:has(.wrap)){
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 16px;
    }
    body:has(.wrap){
      padding:48px 16px 80px;
    }
    .panel{
      background:linear-gradient(145deg,rgba(30,41,75,.92),rgba(15,23,42,.98));
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 16px 48px rgba(0,0,0,.35);
    }
    .login{
      width:min(760px,94%);
      margin:0;
      padding:36px 70px;
      min-height:auto;
    }
    .login h2,.modal-title,.history-title,.slot-title{color:var(--accent)}
    .login h2{margin:0 0 8px;text-align:center;font-size:26px;letter-spacing:.08em}
    .subtitle,.login-subtitle{text-align:center;opacity:.75;font-size:14px}
    .login-subtitle{margin:0 0 24px}
    .field{margin-bottom:16px}
    .field label{display:block;margin-bottom:6px;font-size:13px}
    .input{
      width:100%;padding:11px 14px;font-size:15px;color:#fff;
      background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.3);border-radius:10px;
    }
    .input:focus{outline:none;border-color:var(--accent)}
    .error{color:#f87171;font-size:12px;margin-top:6px}
    .success{color:#4ade80;font-size:12px;margin-top:6px}

    .topbar,.history,.modal,.card{backdrop-filter:blur(8px)}
    .topbar{
      position:fixed;top:20px;right:20px;z-index:20;
      display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:999px;
    }
    .user-name{color:var(--accent);font-weight:600}
    .history{
      position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:10;
      width:300px;max-height:70vh;padding:18px;overflow:auto;
    }
    .history-title{margin:0 0 14px;font-size:18px;letter-spacing:.08em}
    .history-item{padding:12px;margin-bottom:10px;border-radius:12px;border:1px solid rgba(148,163,184,.2);background:rgba(15,23,42,.5);cursor:pointer}
    .history-item:hover{border-color:var(--accent)}
    .history-item-title{font-weight:700;margin-bottom:4px}
    .history-item-info{font-size:12px;opacity:.78}
    .history-item-time{font-size:11px;opacity:.55;margin-top:4px}
    .history-empty{text-align:center;opacity:.5;padding:28px 0}

    .wrap{width:min(1600px,100%);margin:auto;text-align:center;padding:0 340px 0 20px}
    h1{margin:0 0 6px;font-size:clamp(24px,3vw,32px);letter-spacing:.1em}
    .slots{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      align-items:start;
      margin-top:24px;
      max-width:950px;
      margin-left:auto;
      margin-right:auto;
    }
    .card{
      position:relative;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--border);
      background:linear-gradient(145deg,rgba(30,41,75,.82),rgba(15,23,42,.96));
      box-shadow:0 12px 32px rgba(0,0,0,.28);
      overflow:hidden;
      transition:transform 0.2s ease;
    }
    .card:hover{transform:translateY(-2px)}
    .card.active{border-color:rgba(56,189,248,.7)}
    .card.active::after{
      content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 20px rgba(56,189,248,.18);
    }
    .slot-title{margin:0 0 10px;font-size:16px;letter-spacing:.14em}
    .visual{
      position:relative;
      aspect-ratio:4/3;
      border-radius:10px;
      overflow:hidden;
      background:rgba(15,23,42,.85);
      border:1px solid rgba(148,163,184,.18);
    }
    .visual img{
      position:absolute;inset:0;width:100%;height:100%;display:block;
      object-fit:contain;object-position:center;
      transform:translate3d(0,0,0);
      backface-visibility:hidden;
      will-change:transform;
      user-select:none;-webkit-user-drag:none;
      image-rendering:-webkit-optimize-contrast;
      image-rendering:crisp-edges;
    }
    .cover img{object-fit:cover}
    .name{
      height:26px;display:flex;align-items:center;justify-content:center;
      margin-top:8px;font-size:16px;font-weight:700;
      overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    }
    .reel{
      position:absolute;inset:0;
      display:flex;flex-direction:column;
      will-change:transform;
      transform:translate3d(0,0,0);
      transition:none;
    }
    .reel-item{
      flex:0 0 100%;
      position:relative;
      width:100%;height:100%;
    }
    .reel-item img{
      position:absolute;inset:0;width:100%;height:100%;display:block;
      object-fit:inherit;
      transform:translate3d(0,0,0);
      backface-visibility:hidden;
    }

    .controls{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:34px}
    button{
      padding:12px 32px;border:none;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer;
      color:#020617;background:linear-gradient(120deg,#38bdf8,#2dd4bf);box-shadow:0 10px 26px rgba(56,189,248,.3);
      transition:transform 0.15s ease;
    }
    button:hover{transform:translateY(-1px)}
    button:active{transform:scale(.98)}
    button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
    .danger{background:var(--danger);color:#fca5a5;border:1px solid rgba(248,113,113,.4);box-shadow:none}
    .success-btn{background:linear-gradient(120deg,#4ade80,#22c55e);box-shadow:0 10px 26px rgba(74,222,128,.25)}

    .modal-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:grid;place-items:center}
    .modal{width:min(860px,92%);max-height:86vh;padding:28px;overflow:auto}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-title{margin:0;font-size:24px}
    .close{width:36px;height:36px;padding:0;border:none;background:none;color:#fff;font-size:28px;box-shadow:none}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
    .detail-item{padding:14px;border:1px solid rgba(148,163,184,.2);border-radius:12px;background:rgba(15,23,42,.5)}
    .detail-label{font-size:14px;color:var(--accent);margin-bottom:6px}
    .detail-value{font-weight:700;margin-bottom:10px}
    .detail-image{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:rgba(15,23,42,.85)}
    .detail-image img{width:100%;height:100%;object-fit:contain;display:block}

    .switch{margin-top:18px;text-align:center;font-size:13px;opacity:.82}
    .switch a{color:var(--accent);text-decoration:none;cursor:pointer}
    .switch a:hover{text-decoration:underline}

    @media (max-width:1600px){.wrap{padding:0 20px}}
    @media (max-width:1400px){.slots{grid-template-columns:repeat(2,minmax(0,1fr));max-width:650px}}
    @media (max-width:1200px){.history{position:static;transform:none;width:min(420px,96%);margin:0 auto 28px;max-height:360px}}
    @media (max-width:768px){.slots{grid-template-columns:1fr;max-width:400px}.login{padding:36px 22px;min-height:auto}.card{padding:10px}}
    @media (max-width:520px){.topbar{left:12px;right:12px;justify-content:space-between}}
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <div v-if="!isLoggedIn" class="login panel">
      <h2>{{ isLoginMode ? '登录' : '注册' }}</h2>
      <p class="login-subtitle">三角洲行动装备随机抽取系统</p>

      <div class="field">
        <label>用户名</label>
        <input class="input" v-model.trim="loginForm.username" @keyup.enter="submitAuth" placeholder="请输入用户名" />
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" type="password" v-model="loginForm.password" @keyup.enter="submitAuth" placeholder="请输入密码（至少6位）" />
      </div>
      <div v-if="loginError" class="error">{{ loginError }}</div>
      <div v-if="loginSuccess" class="success">{{ loginSuccess }}</div>
      <div class="controls"><button style="flex:1;max-width:280px" @click="submitAuth">{{ isLoginMode ? '登录' : '注册' }}</button></div>
      <div class="switch">{{ isLoginMode ? '还没有账号？' : '已有账号？' }} <a @click="toggleLoginMode">{{ isLoginMode ? '立即注册' : '去登录' }}</a></div>
      <div class="switch" style="padding-top:16px;border-top:1px solid rgba(148,163,184,.2)"><a @click="guestLogin" style="color:#94a3b8">游客登录（不保存历史记录）</a></div>
    </div>

    <template v-else>
      <div class="topbar panel">
        <span class="user-name">{{ currentUser.username }}{{ isGuestMode ? ' (游客)' : '' }}</span>
        <button class="danger" @click="logout">退出登录</button>
      </div>

      <aside class="history panel">
        <h3 class="history-title">抽取历史{{ isGuestMode ? ' (仅本次)' : '' }}</h3>
        <div v-if="!historyList.length" class="history-empty">暂无历史记录</div>
        <div v-for="item in historyList" :key="item.id" class="history-item" @click="viewHistoryDetail(item.id)">
          <div class="history-item-title">{{ item.character }}</div>
          <div class="history-item-info">主武器: {{ item.primary_weapon }}</div>
          <div class="history-item-info">地图: {{ item.map }}</div>
          <div class="history-item-time">{{ formatTime(item.created_at) }}</div>
        </div>
      </aside>

      <div class="wrap">
        <h1>三角洲行动随机装备抽取</h1>
        <p class="subtitle">点击开始按钮，随机抽取角色、主武器、地图、头盔、装甲</p>

        <section class="slots">
          <article v-for="slot in slotOrder" :key="slot" class="card" :class="{ active: rolling }">
            <h3 class="slot-title">{{ slotMeta[slot].label }}</h3>
            <div class="visual" :class="{ cover: slot === 'character' || slot === 'map' }">
              <div class="reel" :ref="setReelRef(slot)">
                <div v-for="n in 3" :key="n" class="reel-item">
                  <img :src="display[slot].image || transparentPixel" :alt="display[slot].name || slotMeta[slot].label" />
                </div>
              </div>
            </div>
            <div class="name">{{ display[slot].name || '准备中...' }}</div>
          </article>
        </section>

        <div class="controls">
          <button :disabled="!assetsReady" :style="{ background: rolling ? 'linear-gradient(120deg,#f472b6,#fb7185)' : undefined }" @click="toggleRolling">
            {{ !assetsReady ? '资源加载中...' : rolling ? '停止抽取' : '开始抽取' }}
          </button>
          <button v-if="!rolling && final.character.name" class="success-btn" @click="saveHistory">保存记录</button>
        </div>
      </div>
    </template>

    <div v-if="showDetailModal" class="modal-bg" @click.self="closeDetailModal">
      <div class="modal panel">
        <div class="modal-head">
          <h3 class="modal-title">抽取详情</h3>
          <button class="close" @click="closeDetailModal">&times;</button>
        </div>
        <div v-if="currentDetail" class="detail-grid">
          <div v-for="item in detailItems" :key="item.key" class="detail-item">
            <div class="detail-label">{{ item.label }}</div>
            <div class="detail-value">{{ currentDetail[item.nameKey] }}</div>
            <div class="detail-image"><img v-if="currentDetail[item.imgKey]" :src="currentDetail[item.imgKey]" :alt="item.label" /></div>
          </div>
        </div>
        <div style="margin-top:20px"><button class="danger" @click="deleteHistory(currentDetail.id)">删除此记录</button></div>
      </div>
    </div>
  </div>

      ],
      armor: [
        ['特里克','https://www.dpcamp.cn/Files/object/protect/armor/p_11050006003.png'],['泰坦','https://www.dpcamp.cn/Files/object/protect/armor/p_11050006004.png'],['老赛甲','https://www.dpcamp.cn/Files/object/protect/armor/p_11050005001.png'],['HVK-2','https://www.dpcamp.cn/Files/object/protect/armor/p_11050005002.png'],['FS复合甲','https://www.dpcamp.cn/Files/object/protect/armor/p_11050005003.png'],['重型突击','https://www.dpcamp.cn/Files/object/protect/armor/p_11050005004.png'],['武士防弹','https://www.dpcamp.cn/Files/object/protect/armor/p_11050004001.png'],['突击手防弹','https://www.dpcamp.cn/Files/object/protect/armor/p_11050004002.png'],['DTA-VS','https://www.dpcamp.cn/Files/object/protect/armor/p_11050004003.png'],['MK-2','https://www.dpcamp.cn/Files/object/protect/armor/p_11050004004.png'],['HMP','https://www.dpcamp.cn/Files/object/protect/armor/p_11050004007.png'],['制式防弹','https://www.dpcamp.cn/Files/object/protect/armor/p_11050003001.png'],['Hvk快拆','https://www.dpcamp.cn/Files/object/protect/armor/p_11050003002.png'],['TGH','https://www.dpcamp.cn/Files/object/protect/armor/p_11050003003.png'],['射手战术','https://www.dpcamp.cn/Files/object/protect/armor/p_11050003004.png'],['简易防刺','https://www.dpcamp.cn/Files/object/protect/armor/p_11050002001.png'],['HT','https://www.dpcamp.cn/Files/object/protect/armor/p_11050002002.png'],['TG','https://www.dpcamp.cn/Files/object/protect/armor/p_11050002003.png'],['通用战术','https://www.dpcamp.cn/Files/object/protect/armor/p_11050002004.png'],['摩托马甲','https://www.dpcamp.cn/Files/object/protect/armor/p_11050001001.png'],['尼龙','https://www.dpcamp.cn/Files/object/protect/armor/p_11050001003.png'],['安保','https://www.dpcamp.cn/Files/object/protect/armor/p_11050001002.png']
      ],
      map: [
        ['机密巴克什','https://game.gtimg.cn/images/dfm/cp/a20240906main/p7-m1-1.jpg'],['绝密巴克什','https://game.gtimg.cn/images/dfm/cp/a20240906main/p7-m1-1.jpg'],['机密大坝','https://game.gtimg.cn/images/dfm/cp/a20240906main/p7-m1-5.jpg'],['监狱','https://game.gtimg.cn/images/dfm/cp/a20240906main/p7-m1-2.jpg'],['机密航天','https://game.gtimg.cn/images/dfm/cp/a20240906main/p7-m1-3.jpg'],['绝密航天','https://game.gtimg.cn/images/dfm/cp/a20240906main/p7-m1-3.jpg']
      ]
    };

    const normalizePools = Object.fromEntries(
      Object.entries(pools).map(([k, arr]) => [k, arr.map(([name, image]) => ({ name, image: image.trim() }))])
    );

    createApp({
      data: () => ({
        transparentPixel,
        slotOrder,
        slotMeta,
        detailItems: [
          { key: 'character', label: '角色', nameKey: 'character', imgKey: 'character_img' },
          { key: 'primary', label: '主武器', nameKey: 'primary_weapon', imgKey: 'primary_img' },
          { key: 'map', label: '地图', nameKey: 'map', imgKey: 'map_img' },
          { key: 'helmet', label: '头盔', nameKey: 'helmet', imgKey: 'helmet_img' },
          { key: 'armor', label: '装甲', nameKey: 'armor', imgKey: 'armor_img' }
        ],
        pools: normalizePools,
        reels: {},
        imageCache: new Map(),
        assetsReady: false,
        rolling: false,
        ticker: 0,
        activeTimer: null,
        animationFrameId: null,
        spinTick: 35,
        lastRollTime: 0,
        final: Object.fromEntries(slotOrder.map(k => [k, { name: '', image: '' }])),
        display: Object.fromEntries(slotOrder.map(k => [k, { name: '', image: '' }])),

        isLoggedIn: false,
        isLoginMode: true,
        isGuestMode: false,
        guestHistoryCounter: 0,
        loginForm: { username: '', password: '' },
        loginError: '',
        loginSuccess: '',
        currentUser: null,
        authToken: '',
        historyList: [],
        showDetailModal: false,
        currentDetail: null
      }),
      methods: {
        setReelRef(slot) {
          return (el) => { if (el) this.reels[slot] = el; };
        },
        rand(category) {
          const list = this.pools[category];
          return list[(Math.random() * list.length) | 0];
        },
        collectSources() {
          return [...new Set(Object.values(this.pools).flat().map(v => v.image).filter(Boolean))];
        },
        preload(src) {
          if (this.imageCache.has(src)) return Promise.resolve();
          return new Promise(resolve => {
            const img = new Image();
            img.onload = () => { 
              this.imageCache.set(src, img); 
              resolve(); 
            };
            img.onerror = () => { 
              this.imageCache.set(src, null); 
              resolve(); 
            };
            img.decoding = 'async';
            img.loading = 'eager';
            img.src = src;
          });
        },
        async prepareAssets() {
          this.assetsReady = false;
          const sources = this.collectSources();
          const batchSize = 10;
          for (let i = 0; i < sources.length; i += batchSize) {
            const batch = sources.slice(i, i + batchSize);
            await Promise.all(batch.map(src => this.preload(src)));
          }
          slotOrder.forEach(slot => {
            this.final[slot] = { name: '', image: '' };
            this.display[slot] = { name: '', image: '' };
          });
          await this.$nextTick();
          this.syncAllReels(false);
          this.assetsReady = true;
        },
        syncReel(slot, animate = true) {
          const el = this.reels[slot];
          if (!el) return;
          const item = this.display[slot];
          const html = Array.from(el.children);
          const cachedImg = this.imageCache.get(item.image);
          html.forEach(node => {
            const img = node.firstElementChild;
            if (img) {
              if (cachedImg && cachedImg instanceof Image) {
                img.src = cachedImg.src;
              } else {
                img.src = item.image || transparentPixel;
              }
            }
          });
          el.style.transition = 'none';
          el.style.transform = 'translate3d(0,0,0)';
          void el.offsetHeight;
          if (animate) {
            requestAnimationFrame(() => {
              el.style.transition = 'transform 60ms cubic-bezier(.25,.8,.25,1)';
              el.style.transform = 'translate3d(0,-100%,0)';
            });
          }
        },
        syncAllReels(animate = true) {
          slotOrder.forEach(slot => this.syncReel(slot, animate));
        },
        rollStep() {
          slotOrder.forEach(slot => { this.display[slot] = this.rand(slot); });
          this.syncAllReels(true);
        },
        startRolling() {
          if (!this.assetsReady || this.rolling) return;
          this.rolling = true;
          this.ticker = 0;
          this.lastRollTime = performance.now();
          this.rollStep();
          const animate = () => {
            if (!this.rolling) return;
            const now = performance.now();
            if (now - this.lastRollTime >= this.spinTick) {
              this.lastRollTime = now;
              this.ticker += 1;
              this.rollStep();
            }
            this.animationFrameId = requestAnimationFrame(animate);
          };
          this.animationFrameId = requestAnimationFrame(animate);
        },
        async stopRolling() {
          if (!this.rolling) return;
          this.rolling = false;
          if (this.animationFrameId) {
            cancelAnimationFrame(this.animationFrameId);
            this.animationFrameId = null;
          }
          slotOrder.forEach(slot => { 
            this.final[slot] = this.rand(slot); 
            this.display[slot] = this.final[slot]; 
          });
          this.syncAllReels(true);
          await new Promise(r => setTimeout(r, 150));
        },
        toggleRolling() {
          this.rolling ? this.stopRolling() : this.startRolling();
        },
        submitAuth() {
          this.isLoginMode ? this.login() : this.register();
        },
        async apiRequest(url, options = {}) {
          const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
          if (this.authToken) headers.Authorization = `Bearer ${this.authToken}`;
          const response = await fetch(`http://localhost:3000${url}`, { ...options, headers });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || '请求失败');
          return data;
        },
        async login() {
          this.loginError = this.loginSuccess = '';
          try {
            const data = await this.apiRequest('/api/login', { method: 'POST', body: JSON.stringify(this.loginForm) });
            this.authToken = data.token;
            this.currentUser = data.user;
            this.isLoggedIn = true;
            this.isGuestMode = false;
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('currentUser', JSON.stringify(data.user));
            await this.loadHistory();
          } catch (e) { this.loginError = e.message; }
        },
        async register() {
          this.loginError = this.loginSuccess = '';
          try {
            await this.apiRequest('/api/register', { method: 'POST', body: JSON.stringify(this.loginForm) });
            this.loginSuccess = '注册成功！请登录';
            this.isLoginMode = true;
          } catch (e) { this.loginError = e.message; }
        },
        toggleLoginMode() {
          this.isLoginMode = !this.isLoginMode;
          this.loginError = this.loginSuccess = '';
        },
        guestLogin() {
          this.isLoggedIn = true;
          this.isGuestMode = true;
          this.currentUser = { username: '游客' };
          this.historyList = [];
          this.guestHistoryCounter = 0;
        },
        logout() {
          this.isLoggedIn = false;
          this.isGuestMode = false;
          this.currentUser = null;
          this.authToken = '';
          this.historyList = [];
          this.guestHistoryCounter = 0;
          localStorage.removeItem('authToken');
          localStorage.removeItem('currentUser');
        },
        async loadHistory() {
          try { this.historyList = await this.apiRequest('/api/history'); }
          catch (e) { console.error('加载历史失败:', e); }
        },
        async saveHistory() {
          const record = {
            character: this.final.character.name,
            primary_weapon: this.final.primary.name,
            map: this.final.map.name,
            helmet: this.final.helmet.name,
            armor: this.final.armor.name,
            character_img: this.final.character.image,
            primary_img: this.final.primary.image,
            map_img: this.final.map.image,
            helmet_img: this.final.helmet.image,
            armor_img: this.final.armor.image,
            created_at: new Date().toISOString()
          };
          if (this.isGuestMode) {
            this.historyList.unshift({ id: ++this.guestHistoryCounter, ...record });
            alert('保存成功！（游客模式，关闭页面后记录将清空）');
            return;
          }
          try {
            await this.apiRequest('/api/history', {
              method: 'POST',
              body: JSON.stringify({
                character: record.character,
                primary: record.primary_weapon,
                map: record.map,
                helmet: record.helmet,
                armor: record.armor,
                images: {
                  character: record.character_img,
                  primary: record.primary_img,
                  map: record.map_img,
                  helmet: record.helmet_img,
                  armor: record.armor_img
                }
              })
            });
            alert('保存成功！');
            await this.loadHistory();
          } catch (e) { alert('保存失败: ' + e.message); }
        },
        async viewHistoryDetail(id) {
          if (this.isGuestMode) {
            const found = this.historyList.find(v => v.id === id);
            if (found) { this.currentDetail = found; this.showDetailModal = true; }
            return;
          }
          try {
            this.currentDetail = await this.apiRequest(`/api/history/${id}`);
            this.showDetailModal = true;
          } catch (e) { alert('加载详情失败: ' + e.message); }
        },
        closeDetailModal() { this.showDetailModal = false; this.currentDetail = null; },
        async deleteHistory(id) {
          if (!confirm('确定要删除这条记录吗？')) return;
          if (this.isGuestMode) {
            this.historyList = this.historyList.filter(v => v.id !== id);
            this.closeDetailModal();
            return;
          }
          try {
            await this.apiRequest(`/api/history/${id}`, { method: 'DELETE' });
            this.closeDetailModal();
            await this.loadHistory();
          } catch (e) { alert('删除失败: ' + e.message); }
        },
        formatTime(v) {
          return new Date(v).toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        }
      },
      async mounted() {
        const token = localStorage.getItem('authToken');
        const user = localStorage.getItem('currentUser');
        if (token && user) {
          this.authToken = token;
          this.currentUser = JSON.parse(user);
          this.isLoggedIn = true;
          await this.loadHistory();
        }
        await this.prepareAssets();
      },
      beforeUnmount() {
        if (this.animationFrameId) {
          cancelAnimationFrame(this.animationFrameId);
        }
        this.imageCache.clear();
      }
    }).mount('#app');
  </script>
</body>
</html>
